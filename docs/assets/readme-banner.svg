    <text x="54" y="167" fill="#ffd447" font-family="Consolas, monospace" font-size="76" font-weight="700" letter-spacing="3">MAZE GAME</text>
    <text x="58" y="210" fill="#f1e8fb" font-family="Consolas, monospace" font-size="20">A way out. A new direction.</text>
    <rect x="58" y="263" width="119" height="31" rx="7" fill="#ffd447"/>
    <text x="76" y="284" fill="#22132d" font-family="Consolas, monospace" font-size="14" font-weight="700">F5 TO PLAY</text>
    <text x="195" y="284" fill="#c6aedc" font-family="Consolas, monospace" font-size="14">C++20 + raylib 5.5</text>
