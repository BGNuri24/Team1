<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Maze Game</title>
  <desc id="description">A purple and gold maze illustration with a green exit, inspired by the game's retro menu.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151025"/>
      <stop offset="0.55" stop-color="#30114d"/>
      <stop offset="1" stop-color="#741657"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b346cf" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ee4bd3" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="bounds"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <path d="M0 235H1200 M0 257H1200 M0 286H1200 M0 325H1200 M600 235L-400 360 M600 235L-50 360 M600 235L250 360 M600 235L480 360 M600 235L720 360 M600 235L950 360 M600 235L1250 360 M600 235L1600 360" fill="none" stroke="url(#floor)" stroke-width="1.5"/>
